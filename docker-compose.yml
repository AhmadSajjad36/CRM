services:
  postgres:
    image: postgres:17
    container_name: medical-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: medical_crm
    ports:
      - "5432:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medical-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - crm_redis_data:/data

volumes:
  crm_postgres_data:
  crm_redis_data:
